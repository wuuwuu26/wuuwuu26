<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Dwyane Luo — Robotics, Computer Vision, Embodied AI</title>
<desc id="hero-desc">Robotics and computer vision at Zhejiang University. Perception, planning, action.</desc>
<defs>
  <linearGradient id="hbg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050b18"/><stop offset="0.55" stop-color="#081426"/><stop offset="1" stop-color="#0a2540"/>
  </linearGradient>
  <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5">
    <stop stop-color="#38bdf8" stop-opacity="0.32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hglow2" cx="0.5" cy="0.5" r="0.5">
    <stop stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hname" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#f8fafc"/><stop offset="1" stop-color="#bae6fd"/>
  </linearGradient>
  <linearGradient id="hline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.10"/>
  </pattern>
  <linearGradient id="head" x1="900" y1="100" x2="1060" y2="240" gradientUnits="userSpaceOnUse">
    <stop stop-color="#f8fafc"/><stop offset="0.55" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
  </linearGradient>
  <linearGradient id="eye" x1="940" y1="145" x2="1020" y2="160" gradientUnits="userSpaceOnUse">
    <stop stop-color="#e0f2fe"/><stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <style>
    .cursor { animation: blink 1.05s steps(2, start) infinite; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    .orbit { transform-origin: 980px 178px; animation: spin 22s linear infinite; }
    .orbit2 { transform-origin: 980px 178px; animation: spin 34s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 8s ease-in-out infinite 0.8s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .pulse { animation: pulse 4.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes scan { 0%, 100% { transform: translateY(0); opacity: 0; } 10%, 90% { opacity: 0.5; } 50% { transform: translateY(70px); opacity: 0.2; } }
  </style>
</defs>
<rect width="1200" height="360" fill="url(#hbg)"/>
<rect width="1200" height="360" fill="url(#hgrid)"/>
<circle cx="1000" cy="150" r="330" fill="url(#hglow)"/>
<circle cx="260" cy="330" r="260" fill="url(#hglow2)"/>
<rect x="36" y="58" width="4" height="244" rx="2" fill="url(#hline)"/>
<text x="70" y="92" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7dd3fc" letter-spacing="3.2">ZHEJIANG UNIVERSITY · ROBOTICS &amp; EMBODIED AI</text>
<text x="66" y="164" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#hname)" letter-spacing="-1">DWYANE LUO</text>
<text x="70" y="207" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Perception <tspan fill="#38bdf8">→</tspan> Planning <tspan fill="#38bdf8">→</tspan> Action</text>
<rect class="cursor" x="458" y="188" width="2.5" height="24" rx="1.25" fill="#38bdf8"/>
<g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">
  <rect x="70" y="246" width="96" height="28" rx="14" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="83" y="264.5" fill="#bae6fd">ROS Noetic</text>
  <rect x="174" y="246" width="70" height="28" rx="14" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="187" y="264.5" fill="#bae6fd">MoveIt</text>
  <rect x="252" y="246" width="78" height="28" rx="14" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.35"/>
  <text x="265" y="264.5" fill="#ddd6fe">PyTorch</text>
  <rect x="338" y="246" width="52" height="28" rx="14" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="351" y="264.5" fill="#a7f3d0">VLA</text>
</g>
<g opacity="0.9">
  <circle class="pulse" cx="980" cy="178" r="118" fill="none" stroke="#38bdf8" stroke-opacity="0.15"/>
  <ellipse class="orbit" cx="980" cy="178" rx="150" ry="62" fill="none" stroke="#38bdf8" stroke-opacity="0.20" stroke-dasharray="3 9"/>
  <ellipse class="orbit2" cx="980" cy="178" rx="128" ry="94" fill="none" stroke="#a78bfa" stroke-opacity="0.14" stroke-dasharray="2 10"/>
  <circle cx="1128" cy="160" r="4.5" fill="#38bdf8"/>
  <circle cx="846" cy="220" r="3" fill="#a78bfa"/>
  <g class="float">
    <path d="M980 92v-18" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="980" cy="70" r="4" fill="#7dd3fc"/>
    <circle cx="980" cy="70" r="9" fill="#38bdf8" fill-opacity="0.16"/>
  </g>
  <g class="float2">
    <rect x="902" y="110" width="156" height="122" rx="40" fill="url(#head)" stroke="#e2e8f0" stroke-opacity="0.55"/>
    <rect x="922" y="130" width="116" height="76" rx="24" fill="#050b18" stroke="#1e293b"/>
    <rect x="946" y="151" width="22" height="9" rx="4.5" fill="url(#eye)"/>
    <rect x="992" y="151" width="22" height="9" rx="4.5" fill="url(#eye)"/>
    <path d="M962 174h36" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <rect x="968" y="232" width="24" height="16" rx="6" fill="#94a3b8"/>
    <path d="M942 248h76l12 20H930l12-20Z" fill="#cbd5e1" stroke="#94a3b8"/>
    <path d="M902 148h-20M1060 148h20" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <circle cx="879" cy="148" r="3.5" fill="#38bdf8"/>
    <circle cx="1083" cy="148" r="3.5" fill="#38bdf8"/>
  </g>
  <rect class="scan" x="880" y="126" width="200" height="1.5" fill="#38bdf8" opacity="0.35"/>
</g>
<g fill="#7dd3fc" opacity="0.45">
  <circle cx="760" cy="74" r="1.6"/><circle cx="820" cy="50" r="1.2"/><circle cx="1150" cy="286" r="1.8"/><circle cx="1090" cy="60" r="1.3"/><circle cx="700" cy="290" r="1.4"/>
</g>
<rect x="0" y="356" width="1200" height="4" fill="url(#hline)"/>
</svg>