<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t-piano d-piano">
<title id="t-piano">Gesture Piano</title>
<desc id="d-piano">A contactless ten-finger rhythm game on Raspberry Pi 5 with MediaPipe.</desc>
