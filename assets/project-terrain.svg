<rect x="0.5" y="0.5" width="639" height="299" rx="16" fill="none" stroke="#223047"/>
<rect x="0" y="296" width="640" height="4" fill="url(#line-terrain)"/>
<text x="34" y="52" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="2.4" opacity="1" text-anchor="start">ROBOTIC MANIPULATION</text>
<text x="34" y="96" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f8fafc" letter-spacing="-0.4" opacity="1" text-anchor="start">MoveIt Terrain Builder</text>
<text x="34" y="126" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c9" letter-spacing="0" opacity="1" text-anchor="start">A Franka Panda stacks a 32×32×8</text><text x="34" y="147" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9fb0c9" letter-spacing="0" opacity="1" text-anchor="start">voxel terrain from contour maps.</text>
