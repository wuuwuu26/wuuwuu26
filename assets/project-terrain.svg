<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t-terrain d-terrain">
<title id="t-terrain">MoveIt Terrain Builder</title>
<desc id="d-terrain">A Franka Panda stacks a 32×32×8 voxel terrain from contour maps.</desc>
<defs>
  <linearGradient id="bg-terrain" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b33"/>
  </linearGradient>
  <radialGradient id="glow-terrain" cx="0.5" cy="0.5" r="0.5">
    <stop stop-color="#fbbf24" stop-opacity="0.28"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid-terrain" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-opacity="0.35"/>
  </pattern>
  <linearGradient id="line-terrain" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#fbbf24" stop-opacity="0"/><stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="640" height="300" rx="16" fill="url(#bg-terrain)"/>
<rect width="640" height="300" rx="16" fill="url(#grid-terrain)" opacity="0.35"/>
<circle cx="530" cy="80" r="190" fill="url(#glow-terrain)"/>
<g>
  <g opacity="0.95">
    <g transform="translate(430 224)">
      <rect x="0" y="0" width="28" height="28" rx="3" fill="#2a1d08" stroke="#fbbf24" stroke-opacity="0.55"/>
      <rect x="28" y="0" width="28" height="28" rx="3" fill="#2a1d08" stroke="#fbbf24" stroke-opacity="0.45"/>
      <rect x="56" y="0" width="28" height="28" rx="3" fill="#2a1d08" stroke="#fbbf24" stroke-opacity="0.35"/>
      <rect x="0" y="28" width="28" height="28" rx="3" fill="#1f1607" stroke="#fbbf24" stroke-opacity="0.4"/>
      <rect x="28" y="28" width="28" height="28" rx="3" fill="#1f1607" stroke="#fbbf24" stroke-opacity="0.3"/>
      <rect x="56" y="28" width="28" height="28" rx="3" fill="#1f1607" stroke="#fbbf24" stroke-opacity="0.25"/>
      <rect x="84" y="0" width="28" height="28" rx="3" fill="#2a1d08" stroke="#fbbf24" stroke-opacity="0.3"/>
    </g>
    <g transform="translate(382 250)">
      <rect x="0" y="0" width="52" height="10" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.45"/>
      <path d="M20 0l16-42 42 14 22-30" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="36" cy="-42" r="6" fill="#fde68a"/><circle cx="78" cy="-28" r="6" fill="#fde68a"/>
      <path d="M100 0l8-10M100 0l20 2" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <rect x="112" y="-20" width="22" height="20" rx="3" fill="#fbbf24" fill-opacity="0.25" stroke="#fde68a"/>
    </g>
    <g fill="#fbbf24" opacity="0.45">
      <circle cx="590" cy="80" r="1.5"/><circle cx="620" cy="112" r="1.2"/><circle cx="560" cy="52" r="1.3"/>
    </g>
  </g>
