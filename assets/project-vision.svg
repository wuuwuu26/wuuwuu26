<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t-vision d-vision">
<title id="t-vision">Machine Vision Labs</title>
<desc id="d-vision">Monocular depth, MVSNet 3D reconstruction, and CNN classification.</desc>
<defs>
